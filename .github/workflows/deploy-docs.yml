name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - "docs-site/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Mintlify CLI
        run: npm i -g mintlify@4.2.835

      - name: Build Mintlify site
        working-directory: docs-site
        run: npx mintlify build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # mintlify build outputs to docs-site/_mintlify by default; fall back to docs-site
          path: docs-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
