name: Greptile 5/5 confidence gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: "Open pull request number to verify"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  checks: write

concurrency:
  group: greptile-confidence-gate-${{ github.event.pull_request.number || inputs.pull_request_number }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted verifier
        uses: actions/checkout@11bd71901bbe5b1630ceea2a1a9e38b2d7f3d7b # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Verify trusted Greptile review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          INPUT_PULL_REQUEST_NUMBER: ${{ inputs.pull_request_number }}
        run: python .github/scripts/greptile_confidence_gate.py
