name: Evaluation Infrastructure CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  validate-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Validate golden set provenance
        run: |
          uv run python -m app.ai.evaluation.validate evals/golden/legal_retrieval_v1.jsonl
          if [ -f evals/golden/legal_retrieval_v2.manifest.json ]; then
            uv run python -m app.ai.evaluation.validate evals/golden/legal_retrieval_v2.jsonl
          else
            echo "Skipping v2 validation - manifest not found"
          fi

      - name: Validate ingestion_v1 provenance and thresholds
        run: |
          test -f evals/golden/ingestion_v1.jsonl || {
            echo "ERROR: evals/golden/ingestion_v1.jsonl is missing; the ingestion_v1 gate fails closed" >&2
            exit 1
          }
          test -f evals/golden/ingestion_v1.manifest.json || {
            echo "ERROR: evals/golden/ingestion_v1.jsonl has no sibling .manifest.json; the ingestion_v1 gate fails closed" >&2
            exit 1
          }
          uv run python - <<'EOF'
          import asyncio
          import json
          import sys
          from collections import Counter
          from pathlib import Path
          from returns.result import Failure
          from app.ai.evaluation.ingestion import validate_ingestion_provenance
          from app.ai.evaluation.schema import (
              GoldenProvenanceManifest,
              load_validated_golden_set,
          )

          async def main() -> None:
              golden_path = Path("evals/golden/ingestion_v1.jsonl")
              manifest_path = Path("evals/golden/ingestion_v1.manifest.json")

              load_result = await load_validated_golden_set(golden_path)
              if isinstance(load_result, Failure):
                  print(f"ERROR: {load_result.failure().message}", file=sys.stderr)
                  sys.exit(1)

              golden_set = load_result.unwrap()
              manifest = GoldenProvenanceManifest.model_validate(
                  json.loads(manifest_path.read_text(encoding="utf-8"))
              )

              provenance = validate_ingestion_provenance(golden_set=golden_set, manifest=manifest)
              if isinstance(provenance, Failure):
                  for issue in provenance.failure():
                      print(f"ERROR: {issue}", file=sys.stderr)
                  sys.exit(1)

              queries = golden_set.queries
              if len(queries) < 20:
                  print(f"ERROR: ingestion_v1 has {len(queries)} rows; minimum is 20", file=sys.stderr)
                  sys.exit(1)

              counts = Counter(q.case_type for q in queries)
              ingestion_types = {
                  "no_evidence_vs_ingestion_failure",
                  "index_not_ready",
                  "partial_coverage_answer",
              }
              for case_type in sorted(ingestion_types):
                  if counts.get(case_type, 0) < 5:
                      print(
                          f"ERROR: case_type '{case_type}' has {counts.get(case_type, 0)} rows; minimum is 5",
                          file=sys.stderr,
                      )
                      sys.exit(1)

              print(
                  f"Provenance gate passed: {len(queries)} rows, "
                  f"all ingestion case-type thresholds met ({dict(counts)})."
              )

          asyncio.run(main())
          EOF

  coverage-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --extra dev

      # Informational: the ingestion_v1 fail-closed gate lives in the
      # validate-provenance job; this audit reports legal_retrieval_v2 coverage
      # so gaps stay visible without blocking merges.
      - name: Audit coverage of legal_retrieval_v2
        run: |
          uv run python - <<'EOF'
          import asyncio
          import sys
          from pathlib import Path
          from returns.result import Failure
          from app.ai.evaluation.ingestion import audit_ingestion_coverage
          from app.ai.evaluation.schema import load_validated_golden_set

          async def main() -> None:
              golden_path = Path("evals/golden/legal_retrieval_v2.jsonl")

              load_result = await load_validated_golden_set(golden_path)
              if isinstance(load_result, Failure):
                  print(f"ERROR: Failed to load golden set: {load_result.failure().message}", file=sys.stderr)
                  sys.exit(1)

              report = await audit_ingestion_coverage(
                  golden_rows=load_result.unwrap().queries,
                  minimum_per_type=5,
              )

              print(f"Total rows analyzed: {report.total_rows}")
              print(f"Case type coverage: {report.case_type_coverage}")

              if report.gaps:
                  print("\nCoverage gaps found:")
                  for gap in report.gaps:
                      print(f"  - {gap.case_type}: {gap.current_count}/{gap.required_minimum}")

              if report.recommendations:
                  print("\nRecommendations:")
                  for recommendation in report.recommendations:
                      print(f"  - {recommendation}")

          asyncio.run(main())
          EOF

  ingestion-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --extra dev

      # Fail-closed gates on the ingestion_v1 artifact. A live ingestion-state
      # provider is intentionally out of scope for this job; CI proves the
      # set loads cleanly and meets the declared coverage contract. State-level
      # comparison vs a real ingestion system is wired behind the provider
      # seam in src/app/ai/evaluation/ingestion.py, not mocked here.
      - name: Validate ingestion_v1 golden set
        run: |
          test -f evals/golden/ingestion_v1.jsonl || {
            echo "ERROR: evals/golden/ingestion_v1.jsonl is missing; failing closed" >&2
            exit 1
          }
          uv run python - <<'EOF'
          import asyncio
          import sys
          from pathlib import Path
          from returns.result import Failure
          from app.ai.evaluation.ingestion import audit_ingestion_coverage
          from app.ai.evaluation.schema import load_validated_golden_set

          async def main() -> None:
              golden_path = Path("evals/golden/ingestion_v1.jsonl")

              load_result = await load_validated_golden_set(golden_path)
              if isinstance(load_result, Failure):
                  print(f"ERROR: failed to load golden set: {load_result.failure().message}", file=sys.stderr)
                  sys.exit(1)

              report = await audit_ingestion_coverage(
                  golden_rows=load_result.unwrap().queries,
                  minimum_per_type=5,
              )
              print(f"Total rows analyzed: {report.total_rows}")
              print(f"Case type coverage: {report.case_type_coverage}")
              if report.gaps:
                  print("Coverage gaps remain:", file=sys.stderr)
                  for gap in report.gaps:
                      print(
                          f"  - {gap.case_type}: {gap.current_count}/{gap.required_minimum}",
                          file=sys.stderr,
                      )
                  sys.exit(1)
              print("Ingestion golden-set gate passed: no coverage gaps.")

          asyncio.run(main())
          EOF

  spot-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --extra dev

      # Fail-closed gate over the designated passing fixture. The four fixtures in
      # evals/fixtures/research_outputs are intentionally degraded harness probes;
      # they are exercised by unit tests, not by this CI gate.
      - name: Spot-check the passing deep-research fixture
        run: >-
          uv run python -m app.ai.evaluation.spot_check
          --report-path evals/reports/spot_check.json
          --fixtures-dir evals/fixtures/research_outputs_passing
          --max-errors 3
