name: Docs CI

on:
  push:
    branches: [main]
    paths:
      - "docs-site/**"
      - ".markdownlint.jsonc"
  pull_request:
    branches: [main]
    paths:
      - "docs-site/**"
      - ".markdownlint.jsonc"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv with Python 3.12
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"
          python-version: "3.12"

      - name: Validate frontmatter
        run: uv run --no-sync --with pyyaml python docs-site/scripts/validate_frontmatter.py

      - name: Check nav completeness
        run: uv run --no-sync python docs-site/scripts/check_nav_completeness.py

      - name: Verify docs (broken links, orphans, stubs)
        run: uv run --no-sync --with pyyaml python docs-site/scripts/verify_docs.py

      - name: Set up Node for markdownlint
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run markdownlint
        run: |
          npx --yes markdownlint-cli2 "docs-site/**/*.mdx" --config .markdownlint.jsonc
