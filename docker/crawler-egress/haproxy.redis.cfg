global
    log stdout format raw local0
    ssl-default-bind-options ssl-min-ver TLSv1.3
    ssl-default-server-options ssl-min-ver TLSv1.2

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend crawler_redis_relay
    bind :6379 ssl crt /run/secrets/crawler_redis_relay_server_pem ca-file /run/secrets/crawler_redis_relay_client_ca verify required
    default_backend managed_redis

backend managed_redis
    server managed-redis "${CRAWLER_REDIS_UPSTREAM_HOST}:${CRAWLER_REDIS_UPSTREAM_PORT}" check ssl verify required ca-file /etc/ssl/certs/ca-certificates.crt sni str("${CRAWLER_REDIS_UPSTREAM_HOST}") verifyhost "${CRAWLER_REDIS_UPSTREAM_HOST}"
