# Production compose — pull-only, no build.
# Every image is pinned to an immutable sha-* or semver tag produced by CI.
# Usage:
#   IMAGE_TAG=sha-9a924a2  docker compose -f docker-compose.prod.yml up -d
#   IMAGE_TAG=v1.2.3       docker compose -f docker-compose.prod.yml up -d
#   # rollback:
#   IMAGE_TAG=sha-<previous> docker compose -f docker-compose.prod.yml up -d
# Never use `latest` in production.
services:
  ai-service-1:
    image: ghcr.io/harmeet10000/langchain-fastapi-production:${IMAGE_TAG:?IMAGE_TAG must be set to sha-<commit> or vX.Y.Z}
    container_name: ai-service-1
    ports:
      - "5000:5000"
    environment:
      ENVIRONMENT: production
    env_file:
      - .env.production
    networks:
      - langchain-network
    restart: unless-stopped
    depends_on:
      timescale:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  celery-worker:
    image: ghcr.io/harmeet10000/langchain-fastapi-production:${IMAGE_TAG:?IMAGE_TAG must be set}
    container_name: celery-worker
    command: celery -A app.connections.celery:celery_app worker --loglevel=info -Q default --concurrency=8
    environment:
      ENVIRONMENT: production
    env_file:
      - .env.production
    networks:
      - langchain-network
    restart: unless-stopped
    depends_on:
      timescale:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  celery-worker-ingestion:
    image: ghcr.io/harmeet10000/langchain-fastapi-production:${IMAGE_TAG:?IMAGE_TAG must be set}
    container_name: celery-worker-ingestion
    command: celery -A app.connections.celery:celery_app worker --loglevel=info -Q ingestion --concurrency=2
    environment:
      ENVIRONMENT: production
    env_file:
      - .env.production
    networks:
      - langchain-network
    restart: unless-stopped
    depends_on:
      timescale:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  celery-worker-crawler:
    image: ghcr.io/harmeet10000/langchain-fastapi-production:${IMAGE_TAG:?IMAGE_TAG must be set}
    container_name: celery-worker-crawler
    command: celery -A app.connections.celery:celery_app worker --loglevel=info -Q crawler --concurrency=2
    environment:
      ENVIRONMENT: production
    env_file:
      - .env.production
    networks:
      - langchain-network
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy

  celery-beat:
    image: ghcr.io/harmeet10000/langchain-fastapi-production:${IMAGE_TAG:?IMAGE_TAG must be set}
    container_name: celery-beat
    command: celery -A app.connections.celery:celery_app beat --loglevel=info
    environment:
      ENVIRONMENT: production
    env_file:
      - .env.production
    networks:
      - langchain-network
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:4-management-alpine@sha256:ac1201d1dc227779d93c607f976e7f9156fd5b551ee5ff7946cab6c242091bf3
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER must be set}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS must be set}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - langchain-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  timescale:
    image: timescale/timescaledb-ha:pg18@sha256:72d93849cd0138586dc8cdcba9d9ed40f25f668a54408892493492b02c56feba
    container_name: timescale_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
    volumes:
      - timescale-data:/home/postgres/pgdata/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - langchain-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    container_name: caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - langchain-network
    restart: unless-stopped
    depends_on:
      - ai-service-1

networks:
  langchain-network:
    driver: bridge

volumes:
  timescale-data:
  rabbitmq-data:
  caddy-data:
  caddy-config:
