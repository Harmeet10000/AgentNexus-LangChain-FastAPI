# Production compose — pull-only, no build.
# Every image is pinned to an immutable sha-* or semver tag produced by CI.
# Usage:
#   IMAGE_TAG=sha-9a924a2  docker compose -f docker-compose.prod.yml up -d
#   IMAGE_TAG=v1.2.3       docker compose -f docker-compose.prod.yml up -d
#   # rollback:
#   IMAGE_TAG=sha-<previous> docker compose -f docker-compose.prod.yml up -d
# Never use `latest` in production.
services:
  ai-service-1:
    image: ghcr.io/harmeet10000/langchain-fastapi-production:${IMAGE_TAG:?IMAGE_TAG must be set to sha-<commit> or vX.Y.Z}
    container_name: ai-service-1
    ports:
      - "5000:5000"
    environment:
      ENVIRONMENT: production
    env_file:
      - .env.production
    networks:
      - langchain-network
    restart: unless-stopped
    # Docker's default is 10s, which would SIGKILL the app inside its 25s
    # lifespan drain and 30s uvicorn connection cap (see
    # docs/runbooks/shutdown-and-restart-drill.md). The chain must be:
    # stop_grace_period (45s) > timeout_graceful_shutdown (30s) > drain (25s).
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health/live', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      timescale:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  celery-worker:
    image: ghcr.io/harmeet10000/langchain-fastapi-production:${IMAGE_TAG:?IMAGE_TAG must be set}
    container_name: celery-worker
    command: worker --role default --loglevel=info
    environment:
      ENVIRONMENT: production
    env_file:
      - .env.production
    networks:
      - langchain-network
    restart: unless-stopped
    # Default 10s grace SIGKILLs mid-task; warm shutdown drains in-flight work.
    stop_grace_period: 45s
    depends_on:
      timescale:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  celery-worker-ingestion:
    image: ghcr.io/harmeet10000/langchain-fastapi-production:${IMAGE_TAG:?IMAGE_TAG must be set}
    container_name: celery-worker-ingestion
    command: worker --role ingestion --loglevel=info
    environment:
      ENVIRONMENT: production
    env_file:
      - .env.production
    networks:
      - langchain-network
    restart: unless-stopped
    stop_grace_period: 45s
    depends_on:
      timescale:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  celery-worker-crawler:
    image: ghcr.io/harmeet10000/langchain-fastapi-production:${IMAGE_TAG:?IMAGE_TAG must be set}
    container_name: celery-worker-crawler
    command: worker --role crawler --loglevel=info
    environment:
      ENVIRONMENT: production
      CRAWLER_EGRESS_ENABLED: "true"
      CRAWLER_EGRESS_PROXY_URL: http://crawler-egress-proxy:4750
      CRAWLER_EGRESS_PUBLIC_PROBE_URL: ${CRAWLER_EGRESS_PUBLIC_PROBE_URL:?CRAWLER_EGRESS_PUBLIC_PROBE_URL must be set}
      CRAWLER_REDIS_RELAY_HOST: crawler-redis-relay
      CRAWLER_REDIS_RELAY_PORT: "6379"
      CRAWLER_REDIS_RELAY_CA_FILE: /run/secrets/crawler_redis_relay_ca
      CRAWLER_REDIS_RELAY_CERT_FILE: /run/secrets/crawler_redis_client_cert
      CRAWLER_REDIS_RELAY_KEY_FILE: /run/secrets/crawler_redis_client_key
      CRAWLER_EGRESS_NO_PROXY: rabbitmq,crawler-redis-relay,localhost,127.0.0.1,::1
      CRAWLER_EXTERNAL_PROCESSING_ENABLED: "false"
      HTTP_PROXY: http://crawler-egress-proxy:4750
      HTTPS_PROXY: http://crawler-egress-proxy:4750
      NO_PROXY: rabbitmq,crawler-redis-relay,localhost,127.0.0.1,::1
      CRAWL4AI_PROXY_ENABLED: "true"
      CRAWL4AI_PROXY: http://crawler-egress-proxy:4750
    env_file:
      - .env.production
    secrets:
      - crawler_redis_relay_ca
      - crawler_redis_client_cert
      - crawler_redis_client_key
    networks:
      - crawler-control
    restart: unless-stopped
    stop_grace_period: 45s
    depends_on:
      rabbitmq:
        condition: service_healthy
      crawler-egress-proxy:
        condition: service_healthy
      crawler-redis-relay:
        condition: service_healthy

  crawler-egress-proxy:
    image: ${SMOKESCREEN_IMAGE:?SMOKESCREEN_IMAGE must be a digest-pinned image built from docker/crawler-egress/smokescreen.Dockerfile}
    command:
      - --config-file
      - /etc/smokescreen/config.yaml
      - --expose-prometheus-metrics
      - --prometheus-listen-ip
      - 0.0.0.0
      - --prometheus-port
      - "9810"
    volumes:
      - ./docker/crawler-egress/smokescreen.production.yaml:/etc/smokescreen/config.yaml:ro
      - ./docker/crawler-egress/smokescreen.production.acl.yaml:/etc/smokescreen/acl.yaml:ro
    networks:
      - crawler-control
      - langchain-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/local/bin/smokescreen", "--version"]
      interval: 10s
      timeout: 5s
      retries: 3

  crawler-redis-relay:
    image: haproxy:3.4.7-alpine@sha256:b9fe316f718d5015c5cfebd8ca019591f3e44656f61d93cb8b59a1028961e530
    environment:
      CRAWLER_REDIS_UPSTREAM_HOST: ${CRAWLER_REDIS_UPSTREAM_HOST:?CRAWLER_REDIS_UPSTREAM_HOST must be set}
      CRAWLER_REDIS_UPSTREAM_PORT: ${CRAWLER_REDIS_UPSTREAM_PORT:-6380}
    volumes:
      - ./docker/crawler-egress/haproxy.redis.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    secrets:
      - crawler_redis_relay_server_pem
      - crawler_redis_relay_client_ca
    networks:
      - crawler-control
      - langchain-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "haproxy", "-c", "-f", "/usr/local/etc/haproxy/haproxy.cfg"]
      interval: 10s
      timeout: 5s
      retries: 3

  celery-beat:
    image: ghcr.io/harmeet10000/langchain-fastapi-production:${IMAGE_TAG:?IMAGE_TAG must be set}
    container_name: celery-beat
    command: beat --loglevel=info
    environment:
      ENVIRONMENT: production
      CELERY_BEAT_SCHEDULE_FILE: /var/lib/celery/celerybeat-schedule
    env_file:
      - .env.production
    volumes:
      - celery-beat-data:/var/lib/celery
    networks:
      - langchain-network
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:4-management-alpine@sha256:ac1201d1dc227779d93c607f976e7f9156fd5b551ee5ff7946cab6c242091bf3
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER must be set}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS must be set}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - langchain-network
      - crawler-control
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  timescale:
    image: timescale/timescaledb-ha:pg18@sha256:72d93849cd0138586dc8cdcba9d9ed40f25f668a54408892493492b02c56feba
    container_name: timescale_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
    volumes:
      - timescale-data:/home/postgres/pgdata/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - langchain-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    container_name: caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - langchain-network
    restart: unless-stopped
    depends_on:
      - ai-service-1

networks:
  langchain-network:
    driver: bridge
  crawler-control:
    driver: bridge
    internal: true

secrets:
  crawler_redis_relay_server_pem:
    file: ${CRAWLER_REDIS_RELAY_SERVER_PEM_FILE:?CRAWLER_REDIS_RELAY_SERVER_PEM_FILE must be set}
  crawler_redis_relay_client_ca:
    file: ${CRAWLER_REDIS_RELAY_CLIENT_CA_FILE:?CRAWLER_REDIS_RELAY_CLIENT_CA_FILE must be set}
  crawler_redis_relay_ca:
    file: ${CRAWLER_REDIS_RELAY_CA_FILE:?CRAWLER_REDIS_RELAY_CA_FILE must be set}
  crawler_redis_client_cert:
    file: ${CRAWLER_REDIS_CLIENT_CERT_FILE:?CRAWLER_REDIS_CLIENT_CERT_FILE must be set}
  crawler_redis_client_key:
    file: ${CRAWLER_REDIS_CLIENT_KEY_FILE:?CRAWLER_REDIS_CLIENT_KEY_FILE must be set}

volumes:
  timescale-data:
  rabbitmq-data:
  celery-beat-data:
  caddy-data:
  caddy-config:
