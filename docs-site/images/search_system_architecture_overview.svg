<svg width="100%" viewBox="0 0 1080 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Documents and ingestion system overview">
  <defs>
    <marker id="sso-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1.5L8 5L2 8.5" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; }
    .gate  { fill: #fee2e2; stroke: #dc2626; }
    .stage { fill: #fef3c7; stroke: #d97706; }
    .idx   { fill: #dcfce7; stroke: #16a34a; }
    .graph { fill: #ede9fe; stroke: #7c3aed; }
    .eval  { fill: #e0f2fe; stroke: #0284c7; }
    .node  { stroke-width: 1.25; }
    rect   { rx: 8; }
    text   { font-family: ui-sans-serif, -apple-system, 'Segoe UI', sans-serif; fill: #0f172a; }
    .title { font-size: 20px; font-weight: 700; }
    .sub   { font-size: 12px; fill: #475569; }
    .n     { font-size: 13px; font-weight: 600; }
    .d     { font-size: 11px; fill: #475569; }
    .flow  { stroke: #64748b; stroke-width: 1.5; fill: none; marker-end: url(#sso-arrow); }
  </style>

  <text class="title" x="30" y="36">Documents system — bulletproof ingestion first</text>
  <text class="sub" x="30" y="56">Never lies, never loses data silently, never degrades without a typed signal</text>

  <rect class="node gate" x="30" y="96" width="190" height="76"/>
  <text class="n" x="46" y="120">POST /documents/upload</text>
  <text class="d" x="46" y="136">bounded read (10 MB default)</text>
  <text class="d" x="46" y="150">extension allowlist · tenant scope</text>
  <text class="d" x="46" y="164">content-hash idempotency</text>

  <rect class="node stage" x="270" y="96" width="180" height="76"/>
  <text class="n" x="286" y="120">Queued ingestion</text>
  <text class="d" x="286" y="136">Celery ingestion role</text>
  <text class="d" x="286" y="150">attempt checkpoints in Postgres</text>
  <text class="d" x="286" y="164">retry budget → terminal state</text>

  <rect class="panel" x="500" y="80" width="380" height="200"/>
  <text class="n" x="520" y="106">Ingestion graph (worker)</text>

  <rect class="node stage" x="520" y="118" width="150" height="48"/>
  <text class="n" x="534" y="138">Parse</text>
  <text class="d" x="534" y="152">Docling · OCR signals</text>

  <rect class="node stage" x="710" y="118" width="150" height="48"/>
  <text class="n" x="724" y="138">Canonical chunks</text>
  <text class="d" x="724" y="152">contract_index · page_no</text>

  <rect class="node stage" x="520" y="186" width="150" height="48"/>
  <text class="n" x="534" y="206">LangExtract</text>
  <text class="d" x="534" y="220">entities · pass-1</text>

  <rect class="node graph" x="710" y="186" width="150" height="48"/>
  <text class="n" x="724" y="206">Relationships</text>
  <text class="d" x="724" y="220">pass-2 · typed edges</text>

  <rect class="node idx" x="270" y="220" width="180" height="76"/>
  <text class="n" x="286" y="244">Versioned persistence</text>
  <text class="d" x="286" y="260">document_version · pipeline_version</text>
  <text class="d" x="286" y="274">upsert on (doc, version, chunk_index)</text>

  <rect class="node idx" x="30" y="230" width="190" height="66"/>
  <text class="n" x="46" y="252">Object storage</text>
  <text class="d" x="46" y="268">S3/R2 original · presigned GET</text>
  <text class="d" x="46" y="282">tenant-scoped key layout</text>

  <rect class="node graph" x="920" y="118" width="130" height="116"/>
  <text class="n" x="934" y="140">Graphiti write</text>
  <text class="d" x="934" y="156">idempotent episodes</text>
  <text class="d" x="934" y="170">verify round trip</text>
  <text class="d" x="934" y="184">graph_indexed_at</text>
  <text class="d" x="934" y="198">coverage signal</text>

  <rect class="panel" x="30" y="330" width="500" height="150"/>
  <text class="n" x="50" y="356">Query surfaces</text>
  <rect class="node eval" x="50" y="368" width="220" height="88"/>
  <text class="n" x="66" y="390">/search · /legal/ask</text>
  <text class="d" x="66" y="406">inline ask · evidence_policy:</text>
  <text class="d" x="66" y="420">graph_indexed_only (HTTP)</text>
  <text class="d" x="66" y="434">mechanically_verified (agent)</text>
  <rect class="node eval" x="300" y="368" width="210" height="88"/>
  <text class="n" x="316" y="390">Agent tool surface</text>
  <text class="d" x="316" y="406">search_evidence → handles</text>
  <text class="d" x="316" y="420">read_evidence_by_id</text>
  <text class="d" x="316" y="434">get_ingestion_state</text>

  <rect class="panel" x="560" y="330" width="490" height="150"/>
  <text class="n" x="580" y="356">Evaluation subsystem (first-class, CI-gated)</text>
  <rect class="node eval" x="580" y="368" width="220" height="88"/>
  <text class="n" x="596" y="390">Golden corpus v2</text>
  <text class="d" x="596" y="406">105 cases · 23 categories · 8 pairs</text>
  <text class="d" x="596" y="420">public + labeled-synthetic sources</text>
  <text class="d" x="596" y="434">provenance manifest + SHA-256 audit</text>
  <rect class="node eval" x="830" y="368" width="200" height="88"/>
  <text class="n" x="846" y="390">Gates</text>
  <text class="d" x="846" y="406">validate CLI · checksum audit</text>
  <text class="d" x="846" y="420">κ ≥ 0.70 dual annotation</text>
  <text class="d" x="846" y="434">release tier requires adjudication</text>

  <path class="flow" d="M220 134 L 270 134"/>
  <path class="flow" d="M450 134 L 500 134"/>
  <path class="flow" d="M670 142 L 710 142"/>
  <path class="flow" d="M595 166 L 595 186"/>
  <path class="flow" d="M670 210 L 710 210"/>
  <path class="flow" d="M870 142 L 920 142"/>
  <path class="flow" d="M710 230 C 640 260 560 270 450 262"/>
  <path class="flow" d="M360 172 L 360 220"/>
  <path class="flow" d="M120 172 L 120 230"/>
  <path class="flow" d="M500 280 C 560 300 600 340 640 360" />
  <path class="flow" d="M260 400 C 290 400 300 400 300 400"/>

  <rect class="panel" x="24" y="510" width="1032" height="80"/>
  <text class="n" x="44" y="536">Terminal honesty</text>
  <text class="d" x="44" y="556">Every document ends completed · completed_with_warnings · failed — with fidelity signals attached (OCR coverage, quality warnings, extraction_incomplete). Success computed over clause writes only; skipped relationship writes emit graph_relationships_skipped, never an all([]) pass.</text>
  <text class="d" x="44" y="576">Re-ingestion stays unexposed until pipeline versioning, cache invalidation and Graphiti replacement semantics exist (see PLAN-bulletproof-ingestion.md).</text>
</svg>
