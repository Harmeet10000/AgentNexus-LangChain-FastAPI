<svg width="100%" viewBox="0 0 1080 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Deployment topology">
  <defs>
    <marker id="dtop-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1.5L8 5L2 8.5" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; }
    .edge  { fill: #e0f2fe; stroke: #0284c7; }
    .app   { fill: #fef3c7; stroke: #d97706; }
    .worker{ fill: #ffedd5; stroke: #ea580c; }
    .data  { fill: #dcfce7; stroke: #16a34a; }
    .graph { fill: #ede9fe; stroke: #7c3aed; }
    .node  { stroke-width: 1.25; }
    rect   { rx: 8; }
    text   { font-family: ui-sans-serif, -apple-system, 'Segoe UI', sans-serif; fill: #0f172a; }
    .title { font-size: 20px; font-weight: 700; }
    .sub   { font-size: 12px; fill: #475569; }
    .n     { font-size: 13px; font-weight: 600; }
    .d     { font-size: 11px; fill: #475569; }
    .flow  { stroke: #64748b; stroke-width: 1.5; fill: none; marker-end: url(#dtop-arrow); }
  </style>

  <text class="title" x="30" y="36">Deployment topology</text>
  <text class="sub" x="30" y="56">Separate worker pools by design — ingestion is minutes of model work; default carries sub-second tasks</text>

  <rect class="node edge" x="30" y="90" width="150" height="60"/>
  <text class="n" x="46" y="114">Caddy</text>
  <text class="d" x="46" y="130">TLS · reverse proxy</text>

  <rect class="panel" x="240" y="76" width="330" height="180"/>
  <text class="n" x="260" y="102">FastAPI application</text>

  <rect class="node app" x="260" y="116" width="140" height="52"/>
  <text class="n" x="274" y="138">v1 / v2 routers</text>
  <text class="d" x="274" y="154">REST · OpenAPI</text>

  <rect class="node app" x="416" y="116" width="140" height="52"/>
  <text class="n" x="430" y="138">WebSocket</text>
  <text class="d" x="430" y="154">/agent-saul/ws/{thread}</text>

  <rect class="node app" x="260" y="186" width="296" height="48"/>
  <text class="n" x="274" y="206">Bounded upload validation</text>
  <text class="d" x="274" y="222">size + extension checked before buffering</text>

  <rect class="panel" x="30" y="300" width="540" height="230"/>
  <text class="n" x="50" y="326">Celery workers (role profiles own queue · pool · concurrency · child-recycle)</text>

  <rect class="node worker" x="50" y="344" width="160" height="70"/>
  <text class="n" x="66" y="366">ingestion</text>
  <text class="d" x="66" y="382">minutes of model work</text>
  <text class="d" x="66" y="396">per message</text>

  <rect class="node worker" x="230" y="344" width="160" height="70"/>
  <text class="n" x="246" y="366">default</text>
  <text class="d" x="246" y="382">billing · transactional</text>
  <text class="d" x="246" y="396">sub-second tasks</text>

  <rect class="node worker" x="410" y="344" width="140" height="70"/>
  <text class="n" x="426" y="366">crawler</text>
  <text class="d" x="426" y="382">browser pool</text>

  <rect class="node worker" x="50" y="440" width="220" height="60"/>
  <text class="n" x="66" y="462">beat</text>
  <text class="d" x="66" y="478">catalog-owned schedule · no task imports</text>

  <rect class="node data" x="300" y="440" width="250" height="60"/>
  <text class="n" x="316" y="462">Outbox relay</text>
  <text class="d" x="316" y="478">durable events · UI notifications</text>

  <rect class="panel" x="610" y="76" width="446" height="454"/>
  <text class="n" x="630" y="102">Stateful backends</text>

  <rect class="node data" x="630" y="116" width="196" height="64"/>
  <text class="n" x="646" y="138">Timescale / PostgreSQL</text>
  <text class="d" x="646" y="154">documents · chunks · pgvector</text>
  <text class="d" x="646" y="168">pg_trgm · LangGraph checkpointer</text>

  <rect class="node data" x="840" y="116" width="196" height="64"/>
  <text class="n" x="856" y="138">RabbitMQ</text>
  <text class="d" x="856" y="154">task exchanges · confirm_publish</text>
  <text class="d" x="856" y="168">DLX per queue</text>

  <rect class="node data" x="630" y="196" width="196" height="64"/>
  <text class="n" x="646" y="218">Redis</text>
  <text class="d" x="646" y="234">evidence handles (TTL) · rate limits</text>
  <text class="d" x="646" y="248">revocation epochs · ws sessions</text>

  <rect class="node graph" x="840" y="196" width="196" height="64"/>
  <text class="n" x="856" y="218">Neo4j (Graphiti)</text>
  <text class="d" x="856" y="234">clause episodes · typed relationships</text>

  <rect class="node data" x="630" y="276" width="196" height="64"/>
  <text class="n" x="646" y="298">MongoDB</text>
  <text class="d" x="646" y="314">accounts · sessions · WS state</text>

  <rect class="node data" x="840" y="276" width="196" height="64"/>
  <text class="n" x="856" y="298">Object storage (S3/R2)</text>
  <text class="d" x="856" y="314">originals · presigned GET</text>

  <rect class="node graph" x="630" y="356" width="196" height="64"/>
  <text class="n" x="646" y="378">LLM providers</text>
  <text class="d" x="646" y="394">Gemini · embeddings · entailment judge</text>

  <rect class="node data" x="840" y="356" width="196" height="64"/>
  <text class="n" x="856" y="378">cognee (local)</text>
  <text class="d" x="856" y="394">episodic memory · degrades gracefully</text>

  <path class="flow" d="M180 120 L 240 120"/>
  <path class="flow" d="M405 142 L 416 142"/>
  <path class="flow" d="M500 168 C 560 200 580 260 610 300"/>
  <path class="flow" d="M130 344 C 130 220 200 160 240 140"/>
  <path class="flow" d="M310 344 C 310 250 330 180 240 150"/>
  <path class="flow" d="M480 414 L 610 420 C 614 422 620 424 630 424" />
  <path class="flow" d="M300 470 C 250 470 240 460 270 452" />
  <path class="flow" d="M826 148 L 840 148"/>
  <path class="flow" d="M630 260 C 600 280 600 300 630 306" />
  <path class="flow" d="M826 228 L 840 228"/>

  <rect class="panel" x="24" y="548" width="1032" height="56"/>
  <text class="n" x="44" y="572">Notes</text>
  <text class="d" x="44" y="590">Worker pools are separate on purpose — one shared pool would make billing tasks wait behind ingestion. A worker started without a role consumes every declared queue, including the DLQ; the role profile owns queue selection.</text>
</svg>
