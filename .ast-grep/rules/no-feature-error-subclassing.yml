id: no-feature-error-subclassing
language: python
severity: error
message: FeatureError subclasses must live in the owning feature or shared-classifier errors.py
note: |
  feature-error-contract — concrete error types inherit FeatureError directly
  and must be declared in the owning errors.py. Shared modules that classify
  third-party failures own unions on the same terms as features (ADR-006).
rule:
  kind: class_definition
  regex: '\(FeatureError'
ignores:
  - src/app/features/*/exceptions.py
  - src/app/features/*/transcript/errors.py
  - src/app/features/crawler/engine_errors.py
  - src/app/ai/**/exceptions.py
  - src/app/shared/**/errors.py
  - src/app/retrieval/**/errors.py
  - src/app/utils/**/errors.py
  # Adapter-owned unions: each classifies its own third-party boundary.
  - src/app/connections/object_storage.py
  - src/app/connections/tavily.py
  - src/app/connections/mailer.py
  - .ast-grep/fixtures/no-feature-error-subclassing/permit.py
