id: no-raw-httpexception
language: python
severity: error
message: Raise a typed APIException subclass, not raw HTTPException.
note: |
  EXCEPTION-RULES.md — raw HTTPException loses error_code, structured message,
  and the `data` payload the Global Exception Handler extracts.

    raise HTTPException(status_code=404, detail="User not found")  # ✗
    raise NotFoundException("User", user_id)                      # ✓

  WebSocketException is exempt — it is the documented WebSocket failure path.
rule:
  pattern: raise HTTPException($$$ARGS)
