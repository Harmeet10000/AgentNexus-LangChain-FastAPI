[alembic]
# Script location for migrations
script_location = src/alembic

# Prepend sys.path with current directory
prepend_sys_path = .

# Path separator for version_locations (replaces deprecated version_path_separator)
path_separator = os
version_locations = src/alembic/versions

# Naming convention for generated migration files: <revision>_<slug>.py
# Matches the sequential 0001-00NN scheme used in this project.
file_template = %%(rev)s_%%(slug)s

# Cap autogenerated slugs so file names stay readable and filesystem-safe
truncate_slug_length = 60

# Timestamps on revisions use UTC regardless of the machine's local timezone
timezone = UTC

# Run env.py for offline commands too (history/show benefit from logging setup)
revision_environment = true

# Require .py files to be present (no compiled-only version locations)
sourceless = false

# Database URL - DO NOT hardcode here!
# This will be set dynamically from env.py using settings
# sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]
# Lint generated migrations with ruff (requires ruff on PATH)
hooks = ruff_format, ruff_check
ruff_format.type = exec
ruff_format.executable = uv
ruff_format.options = run ruff format REVISION_SCRIPT_PATH
ruff_check.type = exec
ruff_check.executable = uv
ruff_check.options = run ruff check --fix REVISION_SCRIPT_PATH

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
