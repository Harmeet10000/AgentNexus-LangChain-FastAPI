services:
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - langchain-network
      - crawler-control
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  crawler-egress-proxy:
    image: langchain-crawler-smokescreen:v0.1.0
    build:
      context: .
      dockerfile: docker/crawler-egress/smokescreen.Dockerfile
    command:
      - --config-file
      - /etc/smokescreen/config.yaml
      - --expose-prometheus-metrics
      - --prometheus-listen-ip
      - 0.0.0.0
      - --prometheus-port
      - "9810"
    volumes:
      - ./docker/crawler-egress/smokescreen.production.yaml:/etc/smokescreen/config.yaml:ro
      - ./docker/crawler-egress/smokescreen.production.acl.yaml:/etc/smokescreen/acl.yaml:ro
    networks:
      - crawler-control
      - langchain-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/local/bin/smokescreen", "--version"]
      interval: 10s
      timeout: 5s
      retries: 3

  crawler-redis-relay:
    image: haproxy:3.4.7-alpine@sha256:b9fe316f718d5015c5cfebd8ca019591f3e44656f61d93cb8b59a1028961e530
    environment:
      CRAWLER_REDIS_UPSTREAM_HOST: ${CRAWLER_REDIS_UPSTREAM_HOST:-redis.example.invalid}
      CRAWLER_REDIS_UPSTREAM_PORT: ${CRAWLER_REDIS_UPSTREAM_PORT:-6380}
    volumes:
      - ./docker/crawler-egress/haproxy.redis.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    secrets:
      - crawler_redis_relay_server_pem
      - crawler_redis_relay_client_ca
    networks:
      - crawler-control
      - langchain-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "haproxy", "-c", "-f", "/usr/local/etc/haproxy/haproxy.cfg"]
      interval: 10s
      timeout: 5s
      retries: 3

  timescale:
    image: timescale/timescaledb-ha:pg18
    container_name: timescale_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-your_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-langchain_db}
      TS_TUNE_MEMORY: 2GB
    volumes:
      - timescale-data:/home/postgres/pgdata/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - langchain-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - langchain-network
    restart: unless-stopped
    depends_on:
      - ai-service-1

  ai-service-1:
    image: ghcr.io/harmeet10000/langchain-fastapi-production:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: docker/dev.Dockerfile
      target: dev
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
        APP_VERSION: ${APP_VERSION:-1.0.0}
    container_name: ai-service-1
    ports:
      - "5000:5000"
    volumes:
      - ./src:/app/src:ro
      - ./data:/app/data
    environment:
      ENVIRONMENT: development
      GIT_SHA: ${GIT_SHA:-unknown}
      BUILD_DATE: ${BUILD_DATE:-unknown}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      POSTGRES_URL: postgresql://postgres:${POSTGRES_PASSWORD:-your_secure_password}@timescale:5432/${POSTGRES_DB:-langchain_db}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS:-guest}@rabbitmq:5672//
    env_file:
      - .env.development
    networks:
      - langchain-network
    restart: unless-stopped
    depends_on:
      timescale:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # --- Background processing -------------------------------------------------
  #
  # Three services, because a queue with no consumer is the failure this change
  # exists to remove: before these existed, every dispatched ingestion task
  # enqueued forever and the only symptom was a document that never finished.
  #
  # Two workers rather than one. Ingestion is minutes of model work per message;
  # the default queue carries sub-second billing and transactional-email tasks.
  # One shared pool means those wait behind ingestion whenever every slot is
  # busy, and `worker_prefetch_multiplier=1` does not prevent it — prefetch stops
  # a worker hoarding messages off the broker and does nothing about head-of-line
  # blocking once every slot is occupied. Disjoint queues with disjoint consumers
  # is what removes the coupling.
  #
  # Every command below selects a role from the same installed interface as the
  # Makefile (`make celery-command` prints the equivalent commands). YAML cannot
  # reference a Makefile variable, so these role selections remain explicit.
  #
  # The role interface emits exactly one queue selection. A worker started without
  # one consumes every declared queue, including the dead-letter queue.
  #
  # `RABBITMQ_URL` is overridden here exactly as it is for the API service, and
  # for these services it is a safety property rather than a convenience:
  # `.env.development` points at a managed broker carrying real billing, credit
  # and password-reset work. A worker that inherited that value would consume and
  # execute it. `environment` wins over `env_file` in compose, which is what makes
  # the override effective.
  celery-worker:
    image: ghcr.io/harmeet10000/langchain-fastapi-production:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: docker/dev.Dockerfile
      target: dev
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
        APP_VERSION: ${APP_VERSION:-1.0.0}
    container_name: celery-worker
    command: uv run worker --role default --loglevel=info
    volumes:
      - ./src:/app/src:ro
      - ./data:/app/data
    environment:
      ENVIRONMENT: development
      GIT_SHA: ${GIT_SHA:-unknown}
      BUILD_DATE: ${BUILD_DATE:-unknown}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      POSTGRES_URL: postgresql://postgres:${POSTGRES_PASSWORD:-your_secure_password}@timescale:5432/${POSTGRES_DB:-langchain_db}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS:-guest}@rabbitmq:5672//
    env_file:
      - .env.development
    networks:
      - langchain-network
    restart: unless-stopped
    depends_on:
      timescale:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Low concurrency is deliberate, not conservative: each slot holds a document
  # conversion and embedding pipeline, so raising it multiplies peak memory by
  # whatever the largest document costs. Scale this service's replicas rather than
  # its concurrency.
  celery-worker-ingestion:
    image: ghcr.io/harmeet10000/langchain-fastapi-production:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: docker/dev.Dockerfile
      target: dev
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
        APP_VERSION: ${APP_VERSION:-1.0.0}
    container_name: celery-worker-ingestion
    command: uv run worker --role ingestion --loglevel=info
    volumes:
      - ./src:/app/src:ro
      - ./data:/app/data
    environment:
      ENVIRONMENT: development
      GIT_SHA: ${GIT_SHA:-unknown}
      BUILD_DATE: ${BUILD_DATE:-unknown}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      POSTGRES_URL: postgresql://postgres:${POSTGRES_PASSWORD:-your_secure_password}@timescale:5432/${POSTGRES_DB:-langchain_db}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS:-guest}@rabbitmq:5672//
    env_file:
      - .env.development
    networks:
      - langchain-network
    restart: unless-stopped
    depends_on:
      timescale:
        condition: service_healthy

  celery-worker-crawler:
    image: ghcr.io/harmeet10000/langchain-fastapi-production:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: docker/dev.Dockerfile
      target: dev
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
        APP_VERSION: ${APP_VERSION:-1.0.0}
    container_name: celery-worker-crawler
    command: uv run worker --role crawler --loglevel=info
    volumes:
      - ./src:/app/src:ro
      - ./data:/app/data
    environment:
      ENVIRONMENT: development
      GIT_SHA: ${GIT_SHA:-unknown}
      BUILD_DATE: ${BUILD_DATE:-unknown}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      POSTGRES_URL: postgresql://postgres:${POSTGRES_PASSWORD:-your_secure_password}@timescale:5432/${POSTGRES_DB:-langchain_db}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS:-guest}@rabbitmq:5672//
      CRAWLER_EGRESS_ENABLED: "true"
      CRAWLER_EGRESS_PROXY_URL: http://crawler-egress-proxy:4750
      CRAWLER_EGRESS_PUBLIC_PROBE_URL: ${CRAWLER_EGRESS_PUBLIC_PROBE_URL:-https://example.com/}
      CRAWLER_REDIS_RELAY_HOST: crawler-redis-relay
      CRAWLER_REDIS_RELAY_PORT: "6379"
      CRAWLER_REDIS_RELAY_CA_FILE: /run/secrets/crawler_redis_relay_ca
      CRAWLER_REDIS_RELAY_CERT_FILE: /run/secrets/crawler_redis_client_cert
      CRAWLER_REDIS_RELAY_KEY_FILE: /run/secrets/crawler_redis_client_key
      CRAWLER_EGRESS_NO_PROXY: rabbitmq,crawler-redis-relay,localhost,127.0.0.1,::1
      CRAWLER_EXTERNAL_PROCESSING_ENABLED: "false"
      HTTP_PROXY: http://crawler-egress-proxy:4750
      HTTPS_PROXY: http://crawler-egress-proxy:4750
      NO_PROXY: rabbitmq,crawler-redis-relay,localhost,127.0.0.1,::1
      CRAWL4AI_PROXY_ENABLED: "true"
      CRAWL4AI_PROXY: http://crawler-egress-proxy:4750
    env_file:
      - .env.development
    secrets:
      - crawler_redis_relay_ca
      - crawler_redis_client_cert
      - crawler_redis_client_key
    networks:
      - crawler-control
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      crawler-egress-proxy:
        condition: service_healthy
      crawler-redis-relay:
        condition: service_healthy

  # The scheduler only publishes; it consumes nothing, so it needs no queue
  # selection. Exactly one replica of this service may run: a second one would
  # publish every scheduled task twice, and the billing and credit tasks it emits
  # are not all idempotent.
  celery-beat:
    image: ghcr.io/harmeet10000/langchain-fastapi-production:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: docker/dev.Dockerfile
      target: dev
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
        APP_VERSION: ${APP_VERSION:-1.0.0}
    container_name: celery-beat
    command: uv run beat --loglevel=info
    volumes:
      - ./src:/app/src:ro
      - celery-beat-data:/var/lib/celery
    environment:
      ENVIRONMENT: development
      GIT_SHA: ${GIT_SHA:-unknown}
      BUILD_DATE: ${BUILD_DATE:-unknown}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      CELERY_BEAT_SCHEDULE_FILE: /var/lib/celery/celerybeat-schedule
      POSTGRES_URL: postgresql://postgres:${POSTGRES_PASSWORD:-your_secure_password}@timescale:5432/${POSTGRES_DB:-langchain_db}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS:-guest}@rabbitmq:5672//
    env_file:
      - .env.development
    networks:
      - langchain-network
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy

  # ── Crawler egress evidence (opt-in profile) ────────────────────────────
  # The proxy under test allows exactly one range — 198.18.0.0/24 — so the
  # permitted and denied fixtures differ by address policy alone, never by
  # routing. The test containers live on the internal control network, so the
  # denied fixture is unreachable for them by construction.
  crawler-egress-proxy-test:
    image: langchain-crawler-smokescreen:v0.1.0
    build:
      context: .
      dockerfile: docker/crawler-egress/smokescreen.Dockerfile
    command:
      - --config-file
      - /etc/smokescreen/config.yaml
      - --expose-prometheus-metrics
      - --prometheus-listen-ip
      - 0.0.0.0
      - --prometheus-port
      - "9810"
    volumes:
      - ./docker/crawler-egress/smokescreen.test.yaml:/etc/smokescreen/config.yaml:ro
      - ./docker/crawler-egress/smokescreen.test.acl.yaml:/etc/smokescreen/acl.yaml:ro
    networks:
      - crawler-control
      - crawler-egress-test
    dns:
      - 198.18.0.53
    profiles:
      - crawler-egress-test
    restart: "no"

  crawler-egress-fixture-public:
    image: python:3.12-alpine@sha256:c5ba3deef00c7758561a0f03c26f44f10589263d40e732b8748e0d1f38f6dd89
    command: ["python", "/fixtures/fixture_server.py", "public"]
    volumes:
      - ./docker/crawler-egress/fixtures:/fixtures:ro
    networks:
      crawler-egress-test:
        ipv4_address: 198.18.0.10
    profiles:
      - crawler-egress-test
    restart: "no"

  crawler-egress-fixture-private:
    image: python:3.12-alpine@sha256:c5ba3deef00c7758561a0f03c26f44f10589263d40e732b8748e0d1f38f6dd89
    command: ["python", "/fixtures/fixture_server.py", "private"]
    volumes:
      - ./docker/crawler-egress/fixtures:/fixtures:ro
      - crawler-egress-hits:/tmp
    networks:
      crawler-egress-test:
        ipv4_address: 10.10.0.10
    profiles:
      - crawler-egress-test
    restart: "no"

  crawler-egress-fixture-dns:
    image: python:3.12-alpine@sha256:c5ba3deef00c7758561a0f03c26f44f10589263d40e732b8748e0d1f38f6dd89
    command: ["python", "/fixtures/fixture_server.py", "dns"]
    volumes:
      - ./docker/crawler-egress/fixtures:/fixtures:ro
    networks:
      crawler-egress-test:
        ipv4_address: 198.18.0.53
    profiles:
      - crawler-egress-test
    restart: "no"

  crawler-egress-tests:
    image: python:3.12-alpine@sha256:c5ba3deef00c7758561a0f03c26f44f10589263d40e732b8748e0d1f38f6dd89
    command: ["python", "/fixtures/connection_policy_test.py"]
    volumes:
      - ./docker/crawler-egress/fixtures:/fixtures:ro
      - crawler-egress-hits:/tmp
    networks:
      - crawler-control
    profiles:
      - crawler-egress-test
    depends_on:
      crawler-egress-proxy-test:
        condition: service_started
      crawler-egress-fixture-public:
        condition: service_started
      crawler-egress-fixture-private:
        condition: service_started
      crawler-egress-fixture-dns:
        condition: service_started

  crawler-egress-bypass-tests:
    image: python:3.12-alpine@sha256:c5ba3deef00c7758561a0f03c26f44f10589263d40e732b8748e0d1f38f6dd89
    command: ["python", "/fixtures/bypass_test.py"]
    volumes:
      - ./docker/crawler-egress/fixtures:/fixtures:ro
    networks:
      - crawler-control
    profiles:
      - crawler-egress-test
    depends_on:
      crawler-egress-proxy-test:
        condition: service_started
      crawler-egress-fixture-public:
        condition: service_started
      crawler-egress-fixture-private:
        condition: service_started

networks:
  langchain-network:
    driver: bridge
  crawler-control:
    driver: bridge
    internal: true
  crawler-egress-test:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 198.18.0.0/24
          gateway: 198.18.0.1
        - subnet: 10.10.0.0/24
          gateway: 10.10.0.1

secrets:
  crawler_redis_relay_server_pem:
    file: ${CRAWLER_REDIS_RELAY_SERVER_PEM_FILE:-./docker/crawler-egress/secrets/relay-server.pem}
  crawler_redis_relay_client_ca:
    file: ${CRAWLER_REDIS_RELAY_CLIENT_CA_FILE:-./docker/crawler-egress/secrets/client-ca.pem}
  crawler_redis_relay_ca:
    file: ${CRAWLER_REDIS_RELAY_CA_FILE:-./docker/crawler-egress/secrets/relay-ca.pem}
  crawler_redis_client_cert:
    file: ${CRAWLER_REDIS_CLIENT_CERT_FILE:-./docker/crawler-egress/secrets/client.crt}
  crawler_redis_client_key:
    file: ${CRAWLER_REDIS_CLIENT_KEY_FILE:-./docker/crawler-egress/secrets/client.key}

volumes:
  timescale-data:
  rabbitmq-data:
  caddy-data:
  caddy-config:
  celery-beat-data:
  crawler-egress-hits:
