<svg width="100%" viewBox="0 0 1080 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Agent Saul orchestration architecture">
  <defs>
    <marker id="asfa-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1.5L8 5L2 8.5" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; }
    .api   { fill: #e0f2fe; stroke: #0284c7; }
    .agent { fill: #fef3c7; stroke: #d97706; }
    .store { fill: #dcfce7; stroke: #16a34a; }
    .graph { fill: #ede9fe; stroke: #7c3aed; }
    .risk  { fill: #fee2e2; stroke: #dc2626; }
    .node  { stroke-width: 1.25; }
    rect   { rx: 8; }
    text   { font-family: ui-sans-serif, -apple-system, 'Segoe UI', sans-serif; fill: #0f172a; }
    .title { font-size: 20px; font-weight: 700; }
    .sub   { font-size: 12px; fill: #475569; }
    .n     { font-size: 13px; font-weight: 600; }
    .d     { font-size: 11px; fill: #475569; }
    .flow  { stroke: #64748b; stroke-width: 1.5; fill: none; marker-end: url(#asfa-arrow); }
  </style>

  <text class="title" x="30" y="36">Agent Saul — orchestration &amp; grounded findings</text>
  <text class="sub" x="30" y="56">Server-derived authorization · TTL evidence handles · mandatory grounding before human review</text>

  <rect class="panel" x="24" y="76" width="500" height="330"/>
  <text class="n" x="44" y="102">Orchestration graph (LangGraph + Postgres checkpointer)</text>

  <rect class="node api" x="44" y="120" width="150" height="52"/>
  <text class="n" x="60" y="142">Intake</text>
  <text class="d" x="60" y="158">session · allowed_doc_ids</text>

  <rect class="node agent" x="44" y="196" width="150" height="60"/>
  <text class="n" x="60" y="220">Planner</text>
  <text class="d" x="60" y="236">plan approval = HITL interrupt</text>

  <rect class="node agent" x="44" y="280" width="150" height="60"/>
  <text class="n" x="60" y="304">Specialists</text>
  <text class="d" x="60" y="320">risk · compliance · deep-research</text>

  <rect class="node risk" x="44" y="364" width="150" height="28"/>
  <text class="n" x="60" y="383">Grounding gate (mandatory)</text>

  <rect class="node store" x="330" y="120" width="170" height="52"/>
  <text class="n" x="346" y="142">Typed findings</text>
  <text class="d" x="346" y="158">claims · EvidenceRef[] · coverage</text>

  <rect class="node store" x="330" y="196" width="170" height="60"/>
  <text class="n" x="346" y="220">Human review (HITL)</text>
  <text class="d" x="346" y="236">approve · reject · override</text>
  <text class="d" x="346" y="250">re-authorized on resume</text>

  <rect class="node graph" x="330" y="280" width="170" height="60"/>
  <text class="n" x="346" y="304">Final report</text>
  <text class="d" x="346" y="320">citations = verified handles</text>

  <rect class="panel" x="548" y="76" width="264" height="330"/>
  <text class="n" x="568" y="102">Authorization &amp; evidence (server-owned)</text>

  <rect class="node graph" x="568" y="120" width="224" height="72"/>
  <text class="n" x="584" y="142">ToolRuntimeContext</text>
  <text class="d" x="584" y="158">user_id · tenant_id · role</text>
  <text class="d" x="584" y="172">allowed_doc_ids (never model-supplied)</text>

  <rect class="node store" x="568" y="216" width="224" height="72"/>
  <text class="n" x="584" y="238">Evidence service</text>
  <text class="d" x="584" y="254">search_evidence → handles</text>
  <text class="d" x="584" y="268">read_evidence_by_id (TTL, re-check)</text>

  <rect class="node store" x="568" y="312" width="224" height="60"/>
  <text class="n" x="584" y="334">Grounding checks</text>
  <text class="d" x="584" y="350">handle ∈ run · quote ⊆ chunk · entailment</text>

  <rect class="panel" x="836" y="76" width="220" height="330"/>
  <text class="n" x="856" y="102">Canonical evidence</text>

  <rect class="node store" x="856" y="120" width="180" height="60"/>
  <text class="n" x="872" y="142">Persisted chunks</text>
  <text class="d" x="872" y="158">chunk_id · contract_index · page_no</text>

  <rect class="node graph" x="856" y="204" width="180" height="60"/>
  <text class="n" x="872" y="226">Graphiti (optional)</text>
  <text class="d" x="872" y="242">relationship retrieval + coverage</text>

  <rect class="node risk" x="856" y="288" width="180" height="60"/>
  <text class="n" x="872" y="310">Ingestion states</text>
  <text class="d" x="872" y="326">index_not_ready · failed · incomplete</text>

  <path class="flow" d="M194 146 L 330 146"/>
  <path class="flow" d="M119 172 L 119 196"/>
  <path class="flow" d="M119 256 L 119 280"/>
  <path class="flow" d="M119 340 L 119 364"/>
  <path class="flow" d="M119 378 C 260 378 260 344 330 344"/>
  <path class="flow" d="M194 310 L 568 252"/>
  <path class="flow" d="M680 192 L 680 216"/>
  <path class="flow" d="M680 288 L 680 312"/>
  <path class="flow" d="M792 252 L 856 150"/>
  <path class="flow" d="M946 180 L 946 204"/>
  <path class="flow" d="M568 342 C 480 342 470 378 194 378"/>
  <path class="flow" d="M500 226 L 568 252"/>

  <rect class="panel" x="24" y="430" width="1032" height="180"/>
  <text class="n" x="44" y="458">Invariants</text>
  <text class="d" x="44" y="482">1. Identity and scope never come from the model — ToolRuntimeContext is constructed server-side and re-resolved on every HITL resume.</text>
  <text class="d" x="44" y="502">2. Evidence handles are TTL-scoped capabilities (run · thread · checkpoint · document version); read_evidence_by_id re-authorizes every call.</text>
  <text class="d" x="44" y="522">3. The grounding gate is a graph transition, not a tool: unsupported findings are rejected or downgraded before human review sees them.</text>
  <text class="d" x="44" y="542">4. Specialists see a ≤7-tool projection (AgentToolBundle); the full catalog stays server-side. Deep research runs as a bounded tool subgraph.</text>
  <text class="d" x="44" y="562">5. Canonical persisted chunks are the only evidence source; Saul adapts them deterministically and never re-segments.</text>
  <text class="d" x="44" y="582">6. Graphiti is a relationship-retrieval backend and coverage signal — non-indexed chunks remain admissible when mechanically verified.</text>
  <text class="d" x="44" y="602">7. Terminal states are typed: not_assessable, statute_not_in_corpus, ingestion_incomplete and no_evidence never render as compliance passes.</text>
</svg>
