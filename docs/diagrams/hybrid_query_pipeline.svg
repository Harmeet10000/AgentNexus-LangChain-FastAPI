<svg width="100%" viewBox="0 0 1080 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hybrid query pipeline">
  <defs>
    <marker id="hqp-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1.5L8 5L2 8.5" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; }
    .q     { fill: #e0f2fe; stroke: #0284c7; }
    .stage { fill: #fef3c7; stroke: #d97706; }
    .graph { fill: #ede9fe; stroke: #7c3aed; }
    .out   { fill: #dcfce7; stroke: #16a34a; }
    .warn  { fill: #fee2e2; stroke: #dc2626; }
    .node  { stroke-width: 1.25; }
    rect   { rx: 8; }
    text   { font-family: ui-sans-serif, -apple-system, 'Segoe UI', sans-serif; fill: #0f172a; }
    .title { font-size: 20px; font-weight: 700; }
    .sub   { font-size: 12px; fill: #475569; }
    .n     { font-size: 13px; font-weight: 600; }
    .d     { font-size: 11px; fill: #475569; }
    .flow  { stroke: #64748b; stroke-width: 1.5; fill: none; marker-end: url(#hqp-arrow); }
    .opt   { stroke: #7c3aed; stroke-dasharray: 5 4; stroke-width: 1.5; fill: none; marker-end: url(#hqp-arrow); }
  </style>

  <text class="title" x="30" y="36">Hybrid query pipeline — scoped, fused, policy-disclosed</text>
  <text class="sub" x="30" y="56">One implementation of the query path · scope and identity always server-derived</text>

  <rect class="node q" x="30" y="100" width="170" height="64"/>
  <text class="n" x="46" y="124">Query</text>
  <text class="d" x="46" y="140">/search · /legal/ask · agent tools</text>
  <text class="d" x="46" y="154">tenant + auth from server context</text>

  <rect class="node stage" x="250" y="100" width="230" height="64"/>
  <text class="n" x="266" y="124">Deterministic scoping</text>
  <text class="d" x="266" y="140">allowed_doc_ids · contract_index</text>
  <text class="d" x="266" y="154">document_kind · jurisdiction · version</text>

  <rect class="node stage" x="530" y="76" width="220" height="56"/>
  <text class="n" x="546" y="98">Lexical leg</text>
  <text class="d" x="546" y="114">BM25 / pg_trgm fuzzy · pg_textsearch</text>

  <rect class="node stage" x="530" y="152" width="220" height="56"/>
  <text class="n" x="546" y="174">Semantic leg</text>
  <text class="d" x="546" y="190">pgvector embeddings · cosine</text>

  <rect class="node stage" x="800" y="114" width="230" height="56"/>
  <text class="n" x="816" y="136">Rank fusion</text>
  <text class="d" x="816" y="152">candidate_limit · rerank top-k</text>

  <rect class="node graph" x="530" y="240" width="220" height="64"/>
  <text class="n" x="546" y="262">Graphiti relationships</text>
  <text class="d" x="546" y="278">obligation chains · party webs</text>
  <text class="d" x="546" y="292">optional — coverage disclosed</text>

  <rect class="node out" x="800" y="240" width="230" height="72"/>
  <text class="n" x="816" y="262">Answer + EvidenceRef[]</text>
  <text class="d" x="816" y="278">chunk_id · document_version</text>
  <text class="d" x="816" y="292">contract_index · page_no</text>
  <text class="d" x="816" y="306">evidence_policy disclosed</text>

  <rect class="node warn" x="250" y="240" width="230" height="88"/>
  <text class="n" x="266" y="262">Typed degradation</text>
  <text class="d" x="266" y="278">no_evidence vs index_not_ready</text>
  <text class="d" x="266" y="292">vs ingestion_failed vs unauthorized</text>
  <text class="d" x="266" y="306">statute_not_in_corpus — never a</text>
  <text class="d" x="266" y="320">silent confident answer</text>

  <rect class="panel" x="30" y="380" width="1000" height="150"/>
  <text class="n" x="50" y="408">Evidence policies</text>
  <rect class="node out" x="50" y="424" width="460" height="76"/>
  <text class="n" x="66" y="446">graph_indexed_only</text>
  <text class="d" x="66" y="462">/legal/ask + /search/ask today: only chunks that passed the</text>
  <text class="d" x="66" y="476">Graphiti write-and-verify round trip are admissible.</text>
  <rect class="node out" x="540" y="424" width="470" height="76"/>
  <text class="n" x="556" y="446">mechanically_verified (agent path)</text>
  <text class="d" x="556" y="462">canonical chunks admissible without graph indexing when scope,</text>
  <text class="d" x="556" y="476">version, handle and quoted-text checks pass. Policies unify after eval.</text>

  <path class="flow" d="M200 132 L 250 132"/>
  <path class="flow" d="M480 122 C 505 115 505 108 530 106"/>
  <path class="flow" d="M480 142 C 505 150 505 165 530 172"/>
  <path class="flow" d="M750 104 L 800 136"/>
  <path class="flow" d="M750 180 L 800 146"/>
  <path class="flow" d="M480 132 C 505 220 505 258 530 266"/>
  <path class="opt" d="M750 272 L 800 274"/>
  <path class="flow" d="M365 168 L 365 240"/>
  <path class="flow" d="M365 328 C 365 350 400 380 540 430"/>

  <rect class="panel" x="30" y="304" width="230" height="0" visibility="hidden"/>
  <text class="d" x="30" y="552">Solid arrows: mandatory path. Dashed: optional Graphiti enrichment — absence degrades to a coverage signal, never to silence.</text>
</svg>
