<svg width="100%" viewBox="0 0 1080 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Memory stack architecture">
  <defs>
    <marker id="mem-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1.5L8 5L2 8.5" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; }
    .state { fill: #dcfce7; stroke: #16a34a; }
    .graph { fill: #ede9fe; stroke: #7c3aed; }
    .cache { fill: #e0f2fe; stroke: #0284c7; }
    .agent { fill: #fef3c7; stroke: #d97706; }
    .warn  { fill: #fee2e2; stroke: #dc2626; }
    .node  { stroke-width: 1.25; }
    rect   { rx: 8; }
    text   { font-family: ui-sans-serif, -apple-system, 'Segoe UI', sans-serif; fill: #0f172a; }
    .title { font-size: 20px; font-weight: 700; }
    .sub   { font-size: 12px; fill: #475569; }
    .n     { font-size: 13px; font-weight: 600; }
    .d     { font-size: 11px; fill: #475569; }
    .flow  { stroke: #64748b; stroke-width: 1.5; fill: none; marker-end: url(#mem-arrow); }
  </style>

  <text class="title" x="30" y="36">Memory stack — durable workflow state vs advisory memory</text>
  <text class="sub" x="30" y="56">Nothing here is the definition of truth; truth lives in canonical chunks and typed findings</text>

  <rect class="panel" x="30" y="90" width="480" height="240"/>
  <text class="n" x="50" y="116">Durable workflow state</text>

  <rect class="node state" x="50" y="132" width="200" height="72"/>
  <text class="n" x="66" y="154">LangGraph checkpointer</text>
  <text class="d" x="66" y="170">Postgres · thread-scoped</text>
  <text class="d" x="66" y="184">Saul pause/resume (HITL)</text>

  <rect class="node cache" x="290" y="132" width="200" height="72"/>
  <text class="n" x="306" y="154">Evidence-handle store</text>
  <text class="d" x="306" y="170">Redis · TTL · run/checkpoint bound</text>
  <text class="d" x="306" y="184">state persists handle IDs only</text>

  <rect class="node state" x="50" y="228" width="200" height="72"/>
  <text class="n" x="66" y="250">Session &amp; revocation</text>
  <text class="d" x="66" y="266">Redis epochs · distributed WS</text>
  <text class="d" x="66" y="280">revocation covers live sessions</text>

  <rect class="node cache" x="290" y="228" width="200" height="72"/>
  <text class="n" x="306" y="250">Search / answer cache</text>
  <text class="d" x="306" y="266">version-aware keys (plan C9)</text>
  <text class="d" x="306" y="280">document + pipeline versions</text>

  <rect class="panel" x="550" y="90" width="500" height="240"/>
  <text class="n" x="570" y="116">Advisory memory (never authoritative)</text>

  <rect class="node graph" x="570" y="132" width="220" height="80"/>
  <text class="n" x="586" y="154">Graphiti knowledge graph</text>
  <text class="d" x="586" y="170">clause episodes · typed relationships</text>
  <text class="d" x="586" y="184">two-pass LangExtract · idempotent writer</text>
  <text class="d" x="586" y="198">coverage signal, not verification</text>

  <rect class="node agent" x="820" y="132" width="210" height="80"/>
  <text class="n" x="836" y="154">cognee episodic memory</text>
  <text class="d" x="836" y="170">agent memory partitions</text>
  <text class="d" x="836" y="184">tenant · kind (reports/session)</text>
  <text class="d" x="836" y="198">misconfiguration degrades boot</text>

  <rect class="node warn" x="570" y="232" width="220" height="72"/>
  <text class="n" x="586" y="254">Writes are approval-gated</text>
  <text class="d" x="586" y="270">HITL approval → idempotent writer</text>
  <text class="d" x="586" y="284">one writer per fact · keyed doc+hash</text>

  <rect class="node warn" x="820" y="232" width="210" height="72"/>
  <text class="n" x="836" y="254">No source text in state</text>
  <text class="d" x="836" y="270">only handles · snippets · spans</text>
  <text class="d" x="836" y="284">hashes · artifact references</text>

  <rect class="panel" x="30" y="360" width="1020" height="150"/>
  <text class="n" x="50" y="388">Coverage — the honest signal surfaced with every answer</text>
  <rect class="node state" x="50" y="404" width="300" height="84"/>
  <text class="n" x="66" y="426">documents</text>
  <text class="d" x="66" y="442">requested · ready · with_warnings</text>
  <text class="d" x="66" y="456">failed · not_ready</text>
  <rect class="node graph" x="390" y="404" width="300" height="84"/>
  <text class="n" x="406" y="426">graph indexing</text>
  <text class="d" x="406" y="442">graph_indexed_documents</text>
  <text class="d" x="406" y="456">graph_unavailable_documents</text>
  <rect class="node warn" x="730" y="404" width="300" height="84"/>
  <text class="n" x="746" y="426">expected-source gaps</text>
  <text class="d" x="746" y="442">statute_not_in_corpus · missing sections</text>
  <text class="d" x="746" y="456">jurisdictions not represented</text>

  <path class="flow" d="M250 168 L 290 168"/>
  <path class="flow" d="M150 204 L 150 228"/>
  <path class="flow" d="M390 264 L 390 288"/>
  <path class="flow" d="M790 172 L 820 172"/>
  <path class="flow" d="M680 212 L 680 232"/>
</svg>
